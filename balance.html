<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>残高照会 | ミライネット銀行(架空)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="balance-page">

  <header class="topbar plain">
    <a class="icon-btn" href="index.html" aria-label="閉じる">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M5 5l14 14M19 5L5 19"/>
      </svg>
    </a>
    <span class="icon-btn">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.3 9.3a2.7 2.7 0 1 1 3.9 2.4c-.9.5-1.2 1-1.2 2" stroke-linecap="round"/>
        <circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
    </span>
  </header>

  <div class="menu-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--blue-2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 9l7 7 7-7"/>
    </svg>
    <span class="divider-v"></span>
    取引メニュー
  </div>

  <div class="notice">
    <span class="notice-tag">銀行からのお知らせ</span>
    <div class="notice-text">
      【重要】メンテナンスのお知らせ（9/20 2:00〜6:00）<a class="link" href="#">詳細はこちら</a>
    </div>
  </div>

  <section class="balance-card">
    <div class="card-label">残高照会</div>
    <div class="total-label">TOTAL</div>
    <div class="total-value"><span id="totalAmount">-</span><span class="yen">円</span></div>
    <div class="diff-pill">前月末比：<span id="prevDiff">-</span>円</div>
  </section>

  <div class="updated-row">
    <span id="updatedAt">-</span>
    <button class="refresh-btn" id="refreshBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/>
        <path d="M18 3v4h-4M6 21v-4h4"/>
      </svg>
      更新
    </button>
  </div>

  <div class="expand-row">
    <button class="expand-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      すべて開く
    </button>
  </div>

  <div class="account-list">
    <div class="account-row">
      <span>円普通預金</span>
      <span class="amount">
        <span><span id="futsuAmount">-</span><span class="yen">円</span></span>
        <button class="circle-plus" aria-label="内訳を開く">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </span>
    </div>
    <div class="account-row">
      <span>ハイブリッド預金</span>
      <span class="amount">
        <span><span id="hybridAmount">-</span><span class="yen">円</span></span>
        <button class="circle-plus" aria-label="内訳を開く">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </span>
    </div>
  </div>

  <div class="section-gap"></div>

  <a class="info-row" href="#">
    各種証明書・依頼書発行
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </a>

  <div class="promo-row">
    <div class="promo-row-head">
      <span>グループ証券保有資産評価</span>
      <a href="#">
        お申込み
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </div>
    <p>グループ証券の残高を表示するには「アグリゲーションサービス」への登録が必要です。</p>
  </div>

  <div class="footer-bar">© Mirai Net Bank, Inc.</div>
</div>

<nav class="webview-nav">
  <span class="nav-arrows">
    <button type="button" disabled aria-label="戻る">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button type="button" disabled aria-label="進む">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </span>
  <button type="button" id="reloadBtn" aria-label="再読み込み">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/>
      <path d="M18 3v4h-4M6 21v-4h4"/>
    </svg>
  </button>
</nav>

<script src="shared-data.js"></script>
<script src="sheet-config.js"></script>
<script src="sheet-data.js"></script>
<script>
  async function renderBalance() {
    // sheet-config.js に公開スプレッドシートのURLが設定されていればそちらを優先し、
    // 未設定・取得失敗時は shared-data.js のモック値を使う。
    const sheetBalance = await fetchLatestBalanceFromSheet();
    const futsuBalance = sheetBalance !== null ? sheetBalance : BANK_ACCOUNT.futsuBalance;
    const totalBalance = futsuBalance + BANK_ACCOUNT.hybridBalance;

    document.getElementById('totalAmount').textContent = formatYen(totalBalance);
    document.getElementById('prevDiff').textContent = formatYen(BANK_ACCOUNT.prevMonthDiff);
    document.getElementById('futsuAmount').textContent = formatYen(futsuBalance);
    document.getElementById('hybridAmount').textContent = formatYen(BANK_ACCOUNT.hybridBalance);
    document.getElementById('updatedAt').textContent = formatNowJP();
  }

  renderBalance();

  document.getElementById('refreshBtn').addEventListener('click', renderBalance);
  document.getElementById('reloadBtn').addEventListener('click', () => location.reload());
</script>
</body>
</html>
