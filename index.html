<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ミライネット銀行" />
<meta name="mobile-web-app-capable" content="yes" />
<title>ミライネット銀行(架空)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="lock-page">
  <div class="lock-brand">ミライネット銀行</div>

  <div class="lock-faceid" id="faceIdIcon">
    <svg width="92" height="92" viewBox="0 0 92 92" fill="none">
      <!-- 四隅のスキャン用ブラケット -->
      <path class="bracket" d="M6 24V14a8 8 0 0 1 8-8h10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path class="bracket" d="M86 24V14a8 8 0 0 0-8-8H68" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path class="bracket" d="M6 68v10a8 8 0 0 0 8 8h10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path class="bracket" d="M86 68v10a8 8 0 0 1-8 8H68" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <!-- 顔（目・口） -->
      <g class="face">
        <path d="M30 38v9" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <path d="M62 38v9" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <path d="M46 40v14h-6" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M29 62c6 6 28 6 34 0" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
      </g>
      <!-- スキャンライン -->
      <rect class="scan-line" x="10" y="10" width="72" height="3" rx="1.5" fill="#fff" opacity="0.85"/>
      <!-- 認証成功のチェック -->
      <path class="check" d="M27 47l12 12 26-26" stroke="var(--green,#3ecf8e)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <div class="lock-status" id="lockStatus">Face IDで認証中…</div>

  <button type="button" class="lock-fallback" id="skipBtn">パスコードを使用</button>
</div>

<script src="shared-data.js"></script>
<script>
  var lockStatus = document.getElementById("lockStatus");
  var faceIdIcon = document.getElementById("faceIdIcon");
  var redirected = false;

  function goHome() {
    if (redirected) return;
    redirected = true;
    window.location.href = "home.html";
  }

  // 顔認証中→認証成功のアニメーションを見せてから、ホーム画面(home.html)へ自動遷移する。
  // 実際の生体認証は行わない、見た目だけの演出。
  setTimeout(function () {
    lockStatus.textContent = "認証されました";
    faceIdIcon.classList.add("success");
  }, 1400);

  setTimeout(goHome, 2000);

  document.getElementById("skipBtn").addEventListener("click", goHome);
</script>
</body>
</html>
